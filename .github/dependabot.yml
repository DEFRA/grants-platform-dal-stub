version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @apollo/server 5.5.1 peers graphql ^16.11.0.
      # Remove when @apollo/server accepts graphql 17.
      - dependency-name: graphql
        versions: ['>=17.0.0']
    groups:
      # Packages that peer each other move together, majors included, or the
      # PR fails npm ci with ERESOLVE. A dependency joins the first group it
      # matches, so these stay above weekly-dependencies.
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        applies-to: version-updates
        patterns:
          - eslint
          - neostandard
      graphql:
        applies-to: version-updates
        patterns:
          - graphql
          - '@apollo/*'
          - '@as-integrations/*'
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: Europe/London
