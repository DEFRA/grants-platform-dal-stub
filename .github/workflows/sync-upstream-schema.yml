name: Sync DAL Schema

# Opens a pull request when DEFRA/fcp-dal-api has schema changes the vendored
# copies do not have yet. While a sync PR is open, a newer sync is added to its
# branch as another commit, so fixes pushed there are kept.
#
# GitHub does not run pull request workflows for changes made with GITHUB_TOKEN,
# so this starts Check Pull Request on the branch itself. Commits are created
# through the API because main requires signed commits.

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  BRANCH: chore/sync-dal-schema
  UPSTREAM_REPO: DEFRA/fcp-dal-api
  UPSTREAM_NOTES: src/graphql/schema/upstream/UPSTREAM.md

jobs:
  sync:
    name: Sync vendored DAL schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Sync with upstream
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SCHEMA_TOKEN: ${{ secrets.UPSTREAM_SCHEMA_TOKEN }}
        run: |
          sync_status=0
          npm run --silent schema:sync > "$RUNNER_TEMP/sync.log" 2>&1 || sync_status=$?
          cat "$RUNNER_TEMP/sync.log"
          # The recorded commit moves on every sync; only a changed vendored file is drift.
          if git diff --quiet -- . ":!$UPSTREAM_NOTES"; then
            exit "$sync_status"
          fi
          echo "drifted=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.sync.outputs.drifted
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash scripts/open-schema-sync-pr.sh
