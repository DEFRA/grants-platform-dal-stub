name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Called by Validate Schema Sync for the pull requests of the Sync DAL Schema
  # workflow, which do not trigger the events above. The inputs are empty on a
  # pull request event, where the jobs check out the merge commit as usual.
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_branch:
        required: true
        type: string
      base_branch:
        required: true
        type: string

jobs:
  checkdeps:
    name: Check lock file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check lockfile sync
        run: |
          npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json || \
          (echo "ERROR: You need to run npm install and commit package-lock.json" && exit 1)

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: |
          npm run format:check
          npm run lint
          npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage

  fixtures:
    # Everything under data/ must be synthetic. The loader in src/data/store.js
    # enforces the identifier ranges and scans every field for issued-looking CRNs
    # and SBIs; this job runs it so a bad fixture fails the PR under its own name.
    name: Fixtures contain only synthetic data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check fixtures
        run: npm run check:fixtures

  upstream-schema:
    # The .gql files under src/graphql/schema/upstream are verbatim copies from
    # DEFRA/fcp-dal-api. This job fails when they differ from the upstream commit
    # recorded in UPSTREAM.md, so a hand edit fails here but a newer upstream does
    # not; the Sync DAL Schema workflow raises a pull request for that. While the
    # upstream repository is not readable the check passes with a warning
    # annotation on the PR.
    name: Vendored DAL schema matches fcp-dal-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compare with upstream
        run: npm run schema:check
        env:
          # Lifts the anonymous GitHub API rate limit; can read upstream while it is public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: token that can read upstream when GITHUB_TOKEN cannot.
          UPSTREAM_SCHEMA_TOKEN: ${{ secrets.UPSTREAM_SCHEMA_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Build production image
        run: docker build --no-cache --tag grants-platform-dal-stub .

      - name: Smoke test the image
        run: |
          docker run -d --name stub -p 3008:3008 grants-platform-dal-stub
          for i in $(seq 1 30); do curl -sf http://localhost:3008/health && break; sleep 1; done
          curl -sf -X POST http://localhost:3008/graphql -H 'content-type: application/json' \
            -d '{"query":"{ business(sbi: \"800000001\") { sbi info { name } } }"}' | grep -q '"sbi":"800000001"'
          docker rm -f stub

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Snyk test
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          # Full history improves the relevance of SonarCloud's new-code reporting
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          # A called run is not a pull request event, so SonarCloud is told which pull request to report on.
          args: >-
            ${{ inputs.pr_number && format(
              '-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2} -Dsonar.qualitygate.wait=true',
              inputs.pr_number, inputs.head_branch, inputs.base_branch) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
