name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  checkdeps:
    name: Check lock file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check lockfile sync
        run: |
          npm install --package-lock-only && git diff --exit-code package-lock.json || \
          (echo "ERROR: You need to run npm install and commit package-lock.json" && exit 1)

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run format:check
          npm run lint
          npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  fixtures:
    # Everything under data/ must be synthetic. The loader in src/data/store.js
    # enforces the identifier ranges and scans every field for issued-looking CRNs
    # and SBIs; this job runs it so a bad fixture fails the PR under its own name.
    name: Fixtures contain only synthetic data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check fixtures
        run: npm run check:fixtures

  upstream-schema:
    # The .gql files under src/graphql/schema/upstream are verbatim copies from
    # DEFRA/fcp-dal-api. This job fails when they have drifted from upstream main,
    # or when upstream has a file we have not classified, so the stub never builds
    # on a stale copy of the real DAL schema. Fix: `npm run schema:sync`, review the
    # diff, update resolvers if needed, and classify any new file in
    # scripts/sync-upstream-schema.js. While the upstream repository is not readable
    # the check passes with a warning annotation on the PR.
    name: Vendored DAL schema matches fcp-dal-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare with upstream
        run: npm run schema:check
        env:
          # Lifts the anonymous GitHub API rate limit; can read upstream while it is public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: token that can read upstream when GITHUB_TOKEN cannot.
          UPSTREAM_SCHEMA_TOKEN: ${{ secrets.UPSTREAM_SCHEMA_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --no-cache --tag grants-platform-dal-stub .

      - name: Smoke test the image
        run: |
          docker run -d --name stub -p 3008:3008 grants-platform-dal-stub
          for i in $(seq 1 30); do curl -sf http://localhost:3008/health && break; sleep 1; done
          curl -sf -X POST http://localhost:3008/graphql -H 'content-type: application/json' \
            -d '{"query":"{ business(sbi: \"300000001\") { sbi info { name } } }"}' | grep -q '"sbi":"300000001"'
          docker rm -f stub

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit (critical)
        run: npm run security-audit

