services:
  grants-platform-dal-stub:
    build:
      context: .
      target: development
    ports:
      - '3008:3008'
    environment:
      PORT: 3008
      NODE_ENV: development
      # Identifier maps (see README). Leave empty locally; values live in
      # environment configuration, never in git.
      CRN_MAP: '${CRN_MAP:-}'
      SBI_MAP: '${SBI_MAP:-}'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3008/health']
      interval: 30s
      start_interval: 1s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - ./data:/home/node/data
      - ./package.json:/home/node/package.json

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
