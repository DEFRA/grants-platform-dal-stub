# SonarCloud project for this repository. The scans run from
# .github/workflows/check-pull-request.yml, publish.yml and publish-hotfix.yml
# and need the SONAR_TOKEN secret. Setup:
# https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md

sonar.projectKey=DEFRA_grants-platform-dal-stub
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/grants-platform-dal-stub
sonar.links.ci=https://github.com/DEFRA/grants-platform-dal-stub/actions
sonar.links.scm=https://github.com/DEFRA/grants-platform-dal-stub
sonar.links.issue=https://github.com/DEFRA/grants-platform-dal-stub/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
